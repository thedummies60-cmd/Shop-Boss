<title>Shop Boss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap';document.head.appendChild(l);})();</script>
<style>
/* Layout: full-bleed 3D shop floor; HUD chips float on the safe-area edges, sheets slide up from the bottom */
:root{
  --ink:#173450;
  --paper:#ffffff;
  --cash:#33b552;
  --cash-deep:#1e7d38;
  --blue:#3fb6f2;
  --sun:#ffc83d;
  --alert:#ff5a4a;
  --veil:rgba(12,32,54,.5);
  --font:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#86d35f;color:var(--ink);font-family:var(--font);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
#game{position:fixed;inset:0;z-index:0}
#game canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;contain:layout}
.lbl>div{transform-origin:50% 100%}
.ico{width:26px;height:26px;object-fit:contain;flex:none;display:block}
.bub{position:relative;display:flex;align-items:center;gap:3px;background:var(--paper);border:3px solid #3ddc84;border-radius:16px;padding:1px 9px 1px 5px;font-weight:800;font-size:17px;line-height:28px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.14);font-variant-numeric:tabular-nums}
.bub .ico{width:30px;height:30px}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:11px;height:11px;background:var(--paper);border-right:3px solid #3ddc84;border-bottom:3px solid #3ddc84;transform:translateX(-50%) rotate(45deg)}
.bub.angry{border-color:var(--alert);animation:wob .5s ease-in-out infinite}.bub.angry::after{border-color:var(--alert)}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.06)}}
.bub.mood{border:0;background:none;box-shadow:none;padding:0;animation:rise 2.4s ease-out forwards}.bub.mood::after{display:none}.bub.mood .ico{width:40px;height:40px}
@keyframes rise{0%{transform:scale(.3)}15%{transform:scale(1.25)}25%{transform:scale(1)}100%{transform:translateY(-26px);opacity:0}}
.bub.pop{animation:bp .25s ease-out}
@keyframes bp{40%{transform:scale(1.18)}}
.ul{display:flex;flex-direction:column;align-items:center;gap:3px}
.ul .nm{font-size:13px;font-weight:800;color:#fff;background:rgba(23,52,80,.8);border-radius:9px;padding:0 9px;line-height:22px;letter-spacing:.02em}
.ul .pr{background:var(--paper);border-radius:14px;padding:0 11px 0 5px;font-weight:800;font-size:18px;line-height:30px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.maxl{background:var(--alert);color:#fff;font-weight:800;border-radius:10px;padding:0 10px;font-size:15px;line-height:24px;box-shadow:0 3px 0 rgba(0,0,0,.2);letter-spacing:.06em;animation:bp .6s ease-in-out infinite}
.pl{background:#6d43e8;color:#fff;font-weight:800;border-radius:12px;padding:0 12px;font-size:15px;line-height:28px;box-shadow:0 3px 0 #3d1fa3}
.ft{position:absolute;font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 var(--cash-deep),0 0 6px rgba(0,0,0,.3);animation:ft 1.1s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none}
@keyframes ft{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}25%{transform:translate(-50%,-50%) translateY(-18px) scale(1.2)}100%{transform:translate(-50%,-50%) translateY(-64px) scale(1);opacity:0}}

#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#money{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:18px;padding:2px 16px 2px 6px;box-shadow:0 4px 0 rgba(23,52,80,.25);font-size:26px;font-weight:800;line-height:46px;font-variant-numeric:tabular-nums;min-width:96px}
#money .ico{width:40px;height:40px}
#money.pop{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{40%{transform:scale(1.16) rotate(-2deg)}}
#worldChip{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));background:rgba(23,52,80,.72);color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:1px 10px;letter-spacing:.03em}
#btns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.sq{width:54px;height:54px;border-radius:18px;border:0;background:var(--paper);box-shadow:0 4px 0 #a9bccb;cursor:pointer;display:grid;place-items:center;position:relative;padding:0;font-family:var(--font);transition:transform .12s}
.sq img{width:44px;height:44px;transition:transform .2s}
.sq:hover img{transform:scale(1.08) rotate(-4deg)}
.sq:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #a9bccb}
.sq:focus-visible,.buy:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sq .dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--alert);border:2px solid #fff;animation:bp 1s ease-in-out infinite}
#hint{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;box-sizing:border-box;bottom:calc(26px + env(safe-area-inset-bottom,0px));background:rgba(23,52,80,.88);color:#fff;font-weight:800;font-size:17px;padding:7px 18px;border-radius:18px;max-width:calc(100% - 32px);text-align:center;text-wrap:balance}
#toast{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;box-sizing:border-box;top:calc(84px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);font-weight:800;font-size:16px;line-height:1.25;padding:5px 14px 5px 8px;border-radius:16px;box-shadow:0 4px 0 #d59a12;max-width:calc(100% - 150px)}
#toast .ico{width:32px;height:32px}
#toast.show{animation:tin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes tin{from{transform:translateY(-30px) scale(.5);opacity:0}}
#dragHint{position:fixed;left:0;right:0;margin-inline:auto;width:fit-content;white-space:nowrap;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:2;pointer-events:none;display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid #3ddc84;border-radius:18px;padding:6px 16px 6px 10px;font-weight:800;font-size:17px;letter-spacing:.04em;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.jk{width:34px;height:34px;border-radius:50%;border:3px solid #3ddc84;position:relative;display:block;box-sizing:border-box}
.jk b{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#3ddc84;animation:jk 1.8s ease-in-out infinite}
@keyframes jk{0%,100%{transform:translate(-7px,0)}25%{transform:translate(0,-7px)}50%{transform:translate(7px,0)}75%{transform:translate(0,7px)}}
#joy{position:fixed;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.65);pointer-events:none;z-index:3}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.22)}
#panel{position:fixed;inset:0;background:var(--veil);z-index:5;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:80%;overflow:auto;box-sizing:border-box;animation:up .35s cubic-bezier(.2,1.3,.4,1);touch-action:pan-y}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sheet h2{margin:0;font-size:26px;font-weight:800;line-height:1.1}
#pClose{width:42px;height:42px;border-radius:14px;border:0;background:#eef3f7;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;font-family:var(--font)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-top:2px solid #eef3f7;animation:rin .35s ease-out both}
.row:nth-child(2){animation-delay:.03s}.row:nth-child(3){animation-delay:.06s}.row:nth-child(4){animation-delay:.09s}.row:nth-child(5){animation-delay:.12s}.row:nth-child(6){animation-delay:.15s}.row:nth-child(7){animation-delay:.18s}.row:nth-child(8){animation-delay:.21s}.row:nth-child(9){animation-delay:.24s}
@keyframes rin{from{transform:translateX(24px);opacity:0}}
.row .ic{width:52px;height:52px;border-radius:16px;background:#eaf6ff;display:grid;place-items:center}
.row .ic img{width:46px;height:46px}
.row .tx{display:flex;flex-direction:column;min-width:0}
.row .tx b{font-size:18px;line-height:1.15}
.row .tx span{font-size:14px;color:#557089;line-height:1.25;font-weight:600}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:12px;height:6px;border-radius:3px;background:#dbe5ec}.pips i.on{background:var(--blue)}
.buy{display:flex;align-items:center;gap:4px;border:0;border-radius:14px;background:var(--cash);color:#fff;font-weight:800;font-size:18px;padding:4px 14px 4px 6px;box-shadow:0 4px 0 var(--cash-deep);cursor:pointer;font-family:var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;min-height:40px;transition:transform .1s}
.buy .ico{width:28px;height:28px}
.buy:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--cash-deep)}
.buy[disabled]{background:#c8d3dc;box-shadow:0 4px 0 #a3b2be;cursor:default}
.buy.ok{background:#eef3f7;color:var(--cash-deep);box-shadow:none;padding:4px 14px}
.buy.txt{padding:4px 14px}
.buy.warn{background:var(--alert);box-shadow:0 4px 0 #b8362a;padding:4px 14px}
.note{font-size:14px;color:#557089;font-weight:600;margin:4px 0 0}
.sec{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7b93a8;margin:14px 0 2px}
.seg{display:flex;gap:3px;background:#eef3f7;border-radius:14px;padding:3px;flex:none}
.seg button{border:0;background:none;font:800 14px var(--font);padding:6px 9px;border-radius:11px;color:#557089;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 #1c6fa8}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.buy.wear{background:var(--blue);box-shadow:0 4px 0 #1c6fa8;padding:4px 14px}
#fade{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#6d43e8,#173450 70%);opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}
#fade.on{opacity:1;pointer-events:auto}
#loading{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#86d35f;transition:opacity .35s ease;--p:0}
#loading.done{opacity:0;pointer-events:none}
.ld-logo{width:min(220px,58vw);aspect-ratio:1}.ld-logo img{width:100%;height:100%;border-radius:22%;box-shadow:0 8px 0 rgba(30,90,30,.25)}
.ld-logo svg{display:block;width:100%;height:100%;overflow:visible;font-family:var(--font);filter:drop-shadow(0 6px 0 rgba(30,90,30,.25))}
.ld-bar{width:min(200px,56vw);height:6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.ld-err{max-width:80vw;color:#fff;font-weight:700;font-size:15px;text-align:center}.ld-err p{margin:0 0 12px}.ld-err button{font:800 16px var(--font);padding:10px 22px;border:0;border-radius:14px;background:#fff;color:#2e7d32;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ld-bar i{display:block;height:100%;width:calc(var(--p) * 100%);border-radius:3px;background:#fff;transition:width .25s ease}
#err{z-index:40}
#menu{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(130% 80% at 50% 35%,rgba(23,52,80,.05),rgba(23,52,80,.62));padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);box-sizing:border-box;animation:mfade .35s ease-out}
@keyframes mfade{from{opacity:0}}
.mwrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(360px,calc(100% - 32px))}
.logo{width:min(292px,80vw);max-height:31vh;aspect-ratio:340/270;transform:rotate(-3deg);animation:lfl 3.2s ease-in-out infinite;margin-bottom:2px}
.logo svg{display:block;width:100%;height:100%;overflow:visible;font-family:var(--font);filter:drop-shadow(0 7px 0 rgba(17,40,66,.32))}
@keyframes lfl{50%{transform:rotate(-1deg) translateY(-6px) scale(1.03)}}
.mtag{color:#fff;font-weight:700;font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
.mbtn{border:0;cursor:pointer;font-family:var(--font);transition:transform .1s}
.mbtn:active{transform:translateY(4px) scale(.97)}
.mbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.mbtn.play{width:100%;height:78px;font-size:34px;font-weight:800;letter-spacing:.08em;background:var(--cash);color:#fff;border-radius:26px;box-shadow:0 7px 0 var(--cash-deep),0 12px 24px rgba(0,0,0,.2);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.mgrid .mbtn{background:#fff;border-radius:22px;box-shadow:0 6px 0 #a9bccb;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px;color:var(--ink)}
.mgrid img{width:60px;height:60px}
.mfoot{color:rgba(255,255,255,.85);font-weight:700;font-size:12px;letter-spacing:.06em}
body.menu-open #hud,body.menu-open #labels,body.menu-open #dragHint{display:none}
#err{position:fixed;left:16px;right:16px;bottom:16px;background:#fff;color:#b8362a;border-radius:12px;padding:10px 14px;font-weight:700;z-index:10;font-size:14px}
@media (prefers-reduced-motion:reduce){.logo,.mbtn.play,#menu{animation:none}.jk b,#toast.show,.sheet,#money.pop,.row,.bub.angry,.maxl,.sq .dot{animation:none}}
</style>

<div id="game"></div>
<div id="labels"></div>
<div id="hud">
  <div id="money"><img class="ico" alt=""><b id="moneyVal">0</b></div>
  <div id="worldChip">Sunny Beach</div>
  <div id="btns">
    <button id="bMenu" class="sq" type="button" aria-label="Menu"><img alt=""></button>
    <button id="bStaff" class="sq" type="button" aria-label="Staff"><img alt=""></button>
    <button id="bUpg" class="sq" type="button" aria-label="Upgrades"><img alt=""></button>
  </div>
  <div id="hint" hidden></div>
  <div id="toast" hidden></div>
</div>
<div id="dragHint" hidden><i class="jk"><b></b></i>DRAG TO MOVE</div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="panel" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pTitle"><header><h2 id="pTitle"></h2><button id="pClose" type="button" aria-label="Close">✕</button></header><div id="pBody"></div></div></div>
<div id="fade"></div>
<div id="menu" hidden><div class="mwrap">
  <div class="logo" role="img" aria-label="Shop Boss"><svg viewBox="0 -20 340 270" aria-hidden="true"><defs><linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3274b5"/><stop offset="1" stop-color="#1b3a63"/></linearGradient><linearGradient id="lgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7a8"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f1a"/></linearGradient><linearGradient id="lgC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff08a"/><stop offset="1" stop-color="#f4a21f"/></linearGradient><linearGradient id="lgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".45" stop-color="#000" stop-opacity="0"/></linearGradient></defs><path d="M44 46H75.5L56 104H18Z" fill="#ee4444"/><path d="M18 103.5A19 19 0 0 0 56 103.5Z" fill="#ee4444"/><path d="M75.5 46H107L94 104H56Z" fill="#fff6ec"/><path d="M56 103.5A19 19 0 0 0 94 103.5Z" fill="#fff6ec"/><path d="M107 46H138.5L132 104H94Z" fill="#ee4444"/><path d="M94 103.5A19 19 0 0 0 132 103.5Z" fill="#ee4444"/><path d="M138.5 46H170L170 104H132Z" fill="#fff6ec"/><path d="M132 103.5A19 19 0 0 0 170 103.5Z" fill="#fff6ec"/><path d="M170 46H201.5L208 104H170Z" fill="#ee4444"/><path d="M170 103.5A19 19 0 0 0 208 103.5Z" fill="#ee4444"/><path d="M201.5 46H233L246 104H208Z" fill="#fff6ec"/><path d="M208 103.5A19 19 0 0 0 246 103.5Z" fill="#fff6ec"/><path d="M233 46H264.5L284 104H246Z" fill="#ee4444"/><path d="M246 103.5A19 19 0 0 0 284 103.5Z" fill="#ee4444"/><path d="M264.5 46H296L322 104H284Z" fill="#fff6ec"/><path d="M284 103.5A19 19 0 0 0 322 103.5Z" fill="#fff6ec"/><path d="M44 46H296L322 104H18Z" fill="url(#lgS)"/><rect x="34" y="32" width="272" height="19" rx="9.5" fill="#c4363d"/><rect x="26" y="114" width="288" height="124" rx="28" fill="url(#lgB)" stroke="#ffc531" stroke-width="7"/><rect x="40" y="123" width="260" height="34" rx="17" fill="#fff" opacity=".09"/><text x="174" y="158" text-anchor="middle" font-size="35" font-weight="800" fill="#fff" letter-spacing="8">SHOP</text><text x="171" y="225" text-anchor="middle" font-size="76" font-weight="800" fill="url(#lgG)" stroke="#7a3e00" stroke-width="4" paint-order="stroke" stroke-linejoin="round" letter-spacing="2">BOSS</text><g transform="rotate(-9 170 26)"><path d="M140 34L133 0L153 15L170 -9L187 15L207 0L200 34Z" fill="url(#lgC)" stroke="#b86b0c" stroke-width="3.5" stroke-linejoin="round"/><rect x="137" y="27" width="66" height="13" rx="5" fill="#ffc531" stroke="#b86b0c" stroke-width="3"/><circle cx="133" cy="0" r="5.5" fill="#fff08a" stroke="#b86b0c" stroke-width="3"/><circle cx="170" cy="-10" r="6.5" fill="#fff08a" stroke="#b86b0c" stroke-width="3"/><circle cx="207" cy="0" r="5.5" fill="#fff08a" stroke="#b86b0c" stroke-width="3"/><circle cx="170" cy="33.5" r="4.5" fill="#e8364a"/><circle cx="153" cy="33.5" r="3.4" fill="#3aa0ff"/><circle cx="187" cy="33.5" r="3.4" fill="#3aa0ff"/></g></svg></div>
  <div class="mtag">Build the biggest shop in 8 worlds</div>
  <button id="mPlay" class="mbtn play" type="button">PLAY</button>

			const userDefineColor = ! ( colors === undefined || colors === null );
			let ballColor = new Color( ballx, bally, ballz );

			if ( userDefineColor ) {

				try {

					ballColor =

							? colors
							: Array.isArray( colors )
								? new Color(
									Math.min( Math.abs( colors[ 0 ] ), 1 ),
									Math.min( Math.abs( colors[ 1 ] ), 1 ),
									Math.min( Math.abs( colors[ 2 ] ), 1 )
							  )
								: new Color( colors );

				} catch ( err ) {

					ballColor = new Color( ballx, bally, ballz );

				}

			}

			// Let's solve the equation to find the radius:
			// 1.0 / (0.000001 + radius^2) * strength - subtract = 0
			// strength / (radius^2) = subtract
			// strength = subtract * radius^2
			// radius^2 = strength / subtract
			// radius = sqrt(strength / subtract)

			const radius = this.size * Math.sqrt( strength / subtract ),
				zs = ballz * this.size,
				ys = bally * this.size,
				xs = ballx * this.size;

			let min_z = Math.floor( zs - radius );
			if ( min_z < 1 ) min_z = 1;
			let max_z = Math.floor( zs + radius );
			if ( max_z > this.size - 1 ) max_z = this.size - 1;
			let min_y = Math.floor( ys - radius );
			if ( min_y < 1 ) min_y = 1;
			let max_y = Math.floor( ys + radius );
			if ( max_y > this.size - 1 ) max_y = this.size - 1;
			let min_x = Math.floor( xs - radius );
			if ( min_x < 1 ) min_x = 1;
			let max_x = Math.floor( xs + radius );

			// well-defined there.

				fz = z / this.size - ballz;
				fz2 = fz * fz;

				for ( y = min_y; y < max_y; y ++ ) {

					y_offset = z_offset + this.size * y;
					fy = y / this.size - bally;
					fy2 = fy * fy;

					for ( x = min_x; x < max_x; x ++ ) {

			// cache attribute lookups
			const size = this.size,
				yd = this.yd,
				zd = this.zd,
				field = this.field;

			let x,
				y,
				z,
				xx,
				val,
				xdiv,
				cxy,
				dist = size * Math.sqrt( strength / subtract );

			if ( dist > size ) dist = size;

			for ( x = 0; x < dist; x ++ ) {

				xdiv = x / size;
				xx = xdiv * xdiv;
				val = strength / ( 0.0001 + xx ) - subtract;

				if ( val > 0.0 ) {

					for ( y = 0; y < size; y ++ ) {

						cxy = x + y * yd;

						for ( z = 0; z < size; z ++ ) {

							field[ zd * z + cxy ] += val;

						}

					}

				}

			}

		};

		this.addPlaneY = function ( strength, subtract ) {

			// cache attribute lookups
			const size = this.size,
				yd = this.yd,
				zd = this.zd,
				field = this.field;

			let x,
				y,
				z,
				yy,
				val,
				ydiv,
				cy,
				cxy,
				dist = size * Math.sqrt( strength / subtract );

			if ( dist > size ) dist = size;

			for ( y = 0; y < dist; y ++ ) {

				ydiv = y / size;
				yy = ydiv * ydiv;
				val = strength / ( 0.0001 + yy ) - subtract;

				if ( val > 0.0 ) {

					cy = y * yd;

					for ( x = 0; x < size; x ++ ) {

						cxy = cy + x;

						for ( z = 0; z < size; z ++ ) field[ zd * z + cxy ] += val;

					}

				}

			}

		};

		this.addPlaneZ = function ( strength, subtract ) {

			// cache attribute lookups

			const size = this.size,
				yd = this.yd,
				zd = this.zd,
				field = this.field;

			let x,
				y,
				z,
				zz,
				val,
				zdiv,
				cz,
				cyz,
				dist = size * Math.sqrt( strength / subtract );

			if ( dist > size ) dist = size;

			for ( z = 0; z < dist; z ++ ) {

				zdiv = z / size;
				zz = zdiv * zdiv;
				val = strength / ( 0.0001 + zz ) - subtract;
				if ( val > 0.0 ) {

					cz = zd * z;

					for ( y = 0; y < size; y ++ ) {

						cyz = cz + y * yd;

						for ( x = 0; x < size; x ++ ) field[ cyz + x ] += val;

					}

				}

			}

		};

		// Updates
		/////////////////////////////////////

		this.setCell = function ( x, y, z, value ) {

			const index = this.size2 * z + this.size * y + x;
			this.field[ index ] = value;

		};

		this.getCell = function ( x, y, z ) {

			const index = this.size2 * z + this.size * y + x;
			return this.field[ index ];

		};

		this.blur = function ( intensity = 1 ) {

			const field = this.field;
			const fieldCopy = field.slice();
			const size = this.size;
			const size2 = this.size2;
			for ( let x = 0; x < size; x ++ ) {

				for ( let y = 0; y < size; y ++ ) {

					for ( let z = 0; z < size; z ++ ) {

						const index = size2 * z + size * y + x;
						let val = fieldCopy[ index ];
						let count = 1;

						for ( let x2 = - 1; x2 <= 1; x2 += 2 ) {

							const x3 = x2 + x;
							if ( x3 < 0 || x3 >= size ) continue;

							for ( let y2 = - 1; y2 <= 1; y2 += 2 ) {

								const y3 = y2 + y;
								if ( y3 < 0 || y3 >= size ) continue;

								for ( let z2 = - 1; z2 <= 1; z2 += 2 ) {

									const z3 = z2 + z;
									if ( z3 < 0 || z3 >= size ) continue;

									const index2 = size2 * z3 + size * y3 + x3;
									const val2 = fieldCopy[ index2 ];

									count ++;
									val += intensity * ( val2 - val ) / count;

								}

							}

						}

						field[ index ] = val;

					}

				}

			}

		};

		this.reset = function () {

			// wipe the normal cache

			for ( let i = 0; i < this.size3; i ++ ) {

				this.normal_cache[ i * 3 ] = 0.0;
				this.field[ i ] = 0.0;
				this.palette[ i * 3 ] = this.palette[ i * 3 + 1 ] = this.palette[
					i * 3 + 2
				] = 0.0;

			}

		};

		this.update = function () {

			this.count = 0;

			// Triangulate. Yeah, this is slow.

			const smin2 = this.size - 2;

			for ( let z = 1; z < smin2; z ++ ) {

				const z_offset = this.size2 * z;
				const fz = ( z - this.halfsize ) / this.halfsize; //+ 1

				for ( let y = 1; y < smin2; y ++ ) {

					const y_offset = z_offset + this.size * y;
					const fy = ( y - this.halfsize ) / this.halfsize; //+ 1

					for ( let x = 1; x < smin2; x ++ ) {

						const fx = ( x - this.halfsize ) / this.halfsize; //+ 1
						const q = y_offset + x;

						 polygonize( fx, fy, fz, q, this.isolation );

					}

				}

			}

			// set the draw range to only the processed triangles

			this.geometry.setDrawRange( 0, this.count );

			// update geometry data

			geometry.getAttribute( 'position' ).needsUpdate = true;
			geometry.getAttribute( 'normal' ).needsUpdate = true;

			if ( this.enableUvs ) geometry.getAttribute( 'uv' ).needsUpdate = true;
			if ( this.enableColors ) geometry.getAttribute( 'color' ).needsUpdate = true;

			// safety check

			if ( this.count / 3 > maxPolyCount ) console.warn( 'THREE.MarchingCubes: Geometry buffers too small for rendering. Please create an instance with a higher poly count.' );

		};

		this.init( resolution );

	}

  const key = kind + '|' + x.id, owned = !!save.owned[key], on = kind === 'c' ? save.look.c === x.id : save.look.h === x.id;

}
function renderPanel() {

    }

    h += `<div class="sec">Staff upgrades</div>`; for (const u of UPG) if (u.g === 'staff') h += upgRow(u);
  } else if (panelKind === 'upg') {

    h += `<div class="sec">Shop</div>`; for (const u of UPG) if (u.g === 'shop') h += upgRow(u);

  } else if (panelKind === 'world') {

  } else if (panelKind === 'set') {

    h += row('note', 'Music', 'Happy shop tunes', seg('music', onoff, S.music ? 1 : 0));
    h += row('vibrate', 'Vibration', 'Buzz when you buy something', seg('vib', onoff, S.vib ? 1 : 0));
    h += `<div class="sec">Screen</div>`;
    h += row('globe', 'Language', 'English or Dutch', seg('lang', [['en', 'English'], ['nl', 'Nederlands']], S.lang || 'en'));
    h += row('gfx', 'Graphics', '4K is the sharpest picture', seg('gfx', [['low', 'Low'], ['medium', 'Mid'], ['high', 'High'], ['ultra', '4K']], S.gfx));
    h += row('camera', 'Camera', 'How far you can see', seg('zoom', [['close', 'Close'], ['normal', 'Mid'], ['far', 'Far']], S.zoom));
    h += row('bubble', 'Customer bubbles', 'Show what customers want', seg('bubbles', [['1', 'Show'], ['0', 'Hide']], S.bubbles ? 1 : 0));
    h += `<div class="sec">Game</div>`;
    h += row('reset', 'Start over', resetArm ? 'This erases all your progress. Tap again.' : 'Erases all worlds, money and hats', `<button type="button" class="buy warn" data-act="reset">${resetArm ? 'Yes, erase' : 'Reset'}</button>`);
    h += `<p class="note">Move: drag your finger across the screen (or use WASD / arrow keys). You can carry different products at the same time. Your game is saved in this browser.</p>`;

}
function openPanel(k) { SFX.click(); panelKind = k; resetArm = false; $('#panel').hidden = false; renderPanel(); joy.id = null; joy.x = joy.y = 0; joyEl.hidden = true; }
function closePanel() { $('#panel').hidden = true; panelKind = null; }
$('#bMenu').addEventListener('click', () => { SFX.click(); openMenu(); });
$('#mPlay').addEventListener('click', () => { ac(); startMusic(); closeMenu(); });
$('#mSkins').addEventListener('click', () => openPanel('skins'));
$('#mWorlds').addEventListener('click', () => openPanel('world'));
$('#mSet').addEventListener('click', () => openPanel('set'));
$('#bStaff').addEventListener('click', () => openPanel('staff'));
$('#bUpg').addEventListener('click', () => openPanel('upg'));
$('#pClose').addEventListener('click', closePanel);
$('#panel').addEventListener('pointerdown', e => { if (e.target.id === 'panel') closePanel(); });
$('#pBody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]'); if (!btn || btn.disabled) return;
  const a = btn.dataset.act, arg = btn.dataset.arg;
  if (a === 'stock') { const pr = stockCost(); if (ws.money < pr) return; ws.money -= pr; ws.stock++; hireStocker(); SFX.hire(); toast('New stocker hired!', 'worker'); }
  else if (a === 'cash') { const pr = Math.round(CASH_COST[arg] * W.mul), co = checkouts.find(c => c.id === arg); if (!co || ws.money < pr) return; ws.money -= pr; ws.cash[arg] = 1; hireCashier(co); SFX.hire(); toast('Cashier hired!', 'register'); }
  else if (a === 'upg') { const u = UPG.find(x => x.k === arg), l = lvl(arg), pr = upgCost(u.base, l); if (l >= u.max || ws.money < pr) return; ws.money -= pr; ws.upg[arg] = l + 1; if (GLOBAL_UPG[arg]) { save.gup = save.gup || {}; save.gup[arg] = l + 1; } if (arg === 'cap') toast(`You can carry ${playerCap()} items now!`, 'crates'); if (arg === 'wcap') toast(`Stockers carry ${wCap()} items now!`, 'crateHelmet'); writeSave(); SFX.hire(); sparkle(player.pos.x, 1.5, player.pos.z, 10); player.hop = 0.42; }
  else if (a === 'go') { travel(+arg); return; }
  else if (a === 'set') { const k = btn.dataset.k, v = btn.dataset.v; if (k === 'sound') { save.sound = v === '1'; if (save.sound) SFX.click(); } else if (k === 'music' || k === 'vib' || k === 'bubbles') { save.set[k] = v === '1'; if (k === 'music') { if (save.set.music) startMusic(); else stopMusic(); } if (k === 'vib') vibrate(40); } else { save.set[k] = v; if (k === 'gfx') applyGfx(); if (k === 'lang') applyLang(); } SFX.click(); }
  else if (a === 'look') { const [kind, id] = arg.split('|'), x = (kind === 'c' ? COLORS : HATS).find(q => q.id === id), pr = lookPrice(x); if (!x || ws.money < pr) return; ws.money -= pr; save.owned[arg] = 1; if (kind === 'c') save.look.c = id; else save.look.h = id; SFX.hire(); applyLook(); toast(`${x.n} unlocked!`, lookIcon(kind, id)); }
  else if (a === 'wear') { const [kind, id] = arg.split('|'); if (kind === 'c') save.look.c = id; else save.look.h = id; SFX.click(); applyLook(); }
  else if (a === 'reset') { if (!resetArm) resetArm = true; else { try { localStorage.removeItem(SKEY); } catch (_) { } save = { v: 1, cur: 0, max: 0, sound: save.sound, set: save.set, w: [] }; initSave(); closePanel(); loadWorld(0); refreshPlayerIcon(); toast('Fresh start!', 'banana'); return; } }
  writeSave(); renderPanel();
});
function travel(i) {
  if (traveling) return; traveling = true; closePanel(); SFX.warp(); $('#fade').classList.add('on');
  setTimeout(() => { save.max = Math.max(save.max || 0, i); writeSave(); loadWorld(i); $('#fade').classList.remove('on'); traveling = false; if (menuOpen) closeMenu(); toast(`Welcome to ${WORLDS[i].name}!`, WORLDS[i].ic); dustRing(player.pos.x, player.pos.z, 1.2); player.hop = 0.42; }, 500);
}
let dotT = 0;
function updDots() {
  const can = g => UPG.some(u => u.g === g && lvl(u.k) < u.max && ws.money >= upgCost(u.base, lvl(u.k)));
  const anyStaff = can('staff') || (ws.stock < STOCK_COST.length && ws.money >= stockCost()) || checkouts.some(co => !ws.cash[co.id] && ws.money >= Math.round(CASH_COST[co.id] * W.mul));
  for (const [id, on] of [['#bUpg', (can('you') || can('shop')) && ws.tut >= TUT.length], ['#bStaff', anyStaff && ws.tut >= TUT.length]]) { const b = $(id); let d = b.querySelector('.dot'); if (on && !d) { d = document.createElement('i'); d.className = 'dot'; b.appendChild(d); } else if (!on && d) d.remove(); }
  if (panelKind) for (const b of document.querySelectorAll('#pBody button[data-price]')) b.disabled = ws.money < +b.dataset.price;
}

/* ================= music, graphics, looks ================= */
let musT = null, musNext = 0, musStep = 0, musGain = null;
const MUS_PROG = [[0, 4, 7], [-3, 0, 4], [5, 9, 12], [7, 11, 14]], MUS_PAT = [0, 1, 2, 1, 2, 1, 0, 2];
function mnote(semi, t, dur, type, vol) { const a = AC, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = 261.63 * Math.pow(2, semi / 12); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(musGain); o.start(t); o.stop(t + dur + 0.05); }
function schedMusic() { const a = AC; if (!a || !save.set.music) return; const spb = 60 / 108 / 2; while (musNext < a.currentTime + 0.35) { const i = musStep, bar = Math.floor(i / 8) % 4, ch = MUS_PROG[bar], beat = i % 8; if (beat === 0) mnote(ch[0] - 24, musNext, spb * 7, 'triangle', 0.08); if (beat === 4) mnote(ch[2] - 24, musNext, spb * 3, 'triangle', 0.05); if (beat % 2 === 0 || (i * 7) % 5 === 0) mnote(ch[MUS_PAT[beat]] + 12, musNext, spb * 1.7, 'sine', 0.04); if (beat % 2 === 1) mnote(ch[1] + 24, musNext, 0.05, 'sine', 0.01); musNext += spb; musStep++; } }
function startMusic() { if (musT || !save || !save.set || !save.set.music || document.hidden) return; const a = ac(); if (!a) return; if (!musGain) { musGain = a.createGain(); musGain.gain.value = 0.55; musGain.connect(a.destination); } musNext = a.currentTime + 0.15; musT = setInterval(schedMusic, 90); }
function stopMusic() { if (musT) { clearInterval(musT); musT = null; } }
function applyGfx() { const g = save.set.gfx; RES.ceil = 1; RES.hold = 3; RES.scale = g === 'ultra' && !DESKTOP ? Math.min(1, 2 / Math.max(1, Math.min(window.devicePixelRatio || 1, 3))) : 1; sun.castShadow = g !== 'low'; const sz = g === 'ultra' ? (DESKTOP && renderer.capabilities.maxTextureSize >= 8192 ? 4096 : 2048) : g === 'high' ? 2048 : 1024; if (sun.shadow.mapSize.x !== sz) { sun.shadow.mapSize.set(sz, sz); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } } resize(); }
function initSave() { save.set = Object.assign({ music: true, vib: true, gfx: 'ultra', zoom: 'normal', bubbles: true, lang: /^nl/i.test(navigator.language || '') ? 'nl' : 'en' }, save.set || {}); applyLang(); if (!save.set.g4k) { save.set.g4k = 1; if (save.set.gfx === 'high') save.set.gfx = 'ultra'; } try { if (localStorage.getItem('winkelbaas-safe')) { localStorage.removeItem('winkelbaas-safe'); save.set.gfx = { ultra: 'high', high: 'medium' }[save.set.gfx] || 'low'; } } catch (_) { } save.owned = save.owned || { 'c|#62c9f5': 1, 'h|none': 1 }; save.look = save.look || { c: '#62c9f5', h: 'none' }; if (save.sound === undefined) save.sound = true; }
function lookIcon(kind, id) { const key = kind + '_' + id; if (!ICON[key]) { if (kind === 'c') renderIcon(key, figure(id, 'none').root, [0.35, 0.25, 1], 0.9); else if (id === 'none') renderIcon(key, figure(save.look.c, 'none').root, [0.35, 0.25, 1], 0.9); else { const g = new THREE.Group(); addHat(g, id); renderIcon(key, g, [0.4, 0.5, 1], 0.95); } } return key; }
function refreshPlayerIcon() { renderIcon('player', figure(save.look.c, save.look.h).root, [0.35, 0.25, 1], 0.9); $('#mSkins img').src = ICON.player.url; }
function applyLook() { if (player) { player.body.material = charMat(save.look.c); for (const m of player.hatMeshes) m.removeFromParent(); player.hatMeshes = addHat(player.head, save.look.h); sparkle(player.pos.x, 1.5, player.pos.z, 12); player.hop = 0.42; } refreshPlayerIcon(); }

/* ================= main menu / pause ================= */
let menuOpen = false, inGame = false, MT = 0;
function openMenu() { menuOpen = true; $('#menu').hidden = false; $('#mPlay').textContent = inGame ? 'RESUME' : 'PLAY'; document.body.classList.add('menu-open'); joy.id = null; joy.x = joy.y = 0; joyEl.hidden = true; for (const k in keys) keys[k] = false; writeSave(); }
function closeMenu() { menuOpen = false; $('#menu').hidden = true; document.body.classList.remove('menu-open'); if (!inGame) { inGame = true; custT = Math.min(custT, 1.2); if (ws.tut === 0) $('#dragHint').hidden = moved; updCamera(0, true); } }
function onBack() { if (!$('#panel').hidden) { closePanel(); return; } if (menuOpen) { if (inGame) closeMenu(); else if (CapApp && CapApp.exitApp) CapApp.exitApp(); return; } openMenu(); }
let CapApp = null; try { const C = window.Capacitor; if (C && C.isNativePlatform && C.isNativePlatform()) { CapApp = C.Plugins?.App || (C.registerPlugin ? C.registerPlugin('App') : null); CapApp?.addListener?.('backButton', onBack); } } catch (_) { CapApp = null; }
window.addEventListener('keydown', e => { if (e.key === 'Escape') onBack(); });

/* ================= main loop ================= */
let last = performance.now(), lastP = last, ready = false, SIM = 1;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const pn = performance.now(), raw = pn - lastP; lastP = pn;
  if (!ready) return;
  tuneRes(raw);
  MT += dt;
  const paused = menuOpen && inGame;
  if (!paused) for (let k = 0; k < SIM; k++) {
    TIME += dt;
    if (!traveling) { if (inGame) updPlayer(dt); updWorld(dt); if (inGame) updTutorial(); }
    updFlights(dt); updTweens(dt); updBumps(dt); updDrops(dt); updParts(dt);
  }
  updCamera(dt); updLabels(); updHud(dt);
  dotT -= dt; if (dotT <= 0) { dotT = 0.5; updDots(); }
  saveT -= dt; if (saveT <= 0) { saveT = 5; writeSave(); }
  renderer.render(scene, camera);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { writeSave(); stopMusic(); if (inGame && !menuOpen) openMenu(); } else startMusic(); });
window.addEventListener('pagehide', writeSave);

const nf = () => new Promise(r => { let d = false; const f = () => { if (!d) { d = true; r(); } }; requestAnimationFrame(f); setTimeout(f, 60); });
const LP = (p, m) => { try { if (window.__lp) window.__lp(p, m); } catch (_) { } };
async function start(data) {
  try { await boot(data); } catch (e) {
    console.error(e); try { window.__ldone && window.__ldone(); } catch (_) { }
    const d = document.getElementById('err') || Object.assign(document.createElement('div'), { id: 'err' }); d.textContent = 'Error: ' + (e && e.message || e); document.body.appendChild(d);
  }
}
async function boot(data) {
  LP(0.32, 'Opening the doors…'); await nf();
  save = data && Array.isArray(data.w) ? data : loadSave(); initSave(); applyGfx();
  try { await Promise.race([document.fonts.load('800 60px "Baloo 2"'), new Promise(r => setTimeout(r, 500))]); } catch (_) { }
  LP(0.42, 'Waking up the shoppers…'); await nf();
  itemGeo('banana');
  FIG_GEO = buildFigureGeo();
  LP(0.55, 'Polishing the products…'); await nf();
  ICON_DEFER = true; try { buildIcons(); } finally { ICON_DEFER = false; }
  refreshPlayerIcon();
  LP(0.66, 'Building your shop…'); await nf();
  loadWorld(clamp(save.cur || 0, 0, WORLDS.length - 1));
  $('#mWorlds img').src = ICON.globe.url; $('#mSet img').src = ICON.gear.url;
  LP(0.84, 'Stocking the shelves…'); await nf();
  try { updCamera(0, true); renderer.compile(scene, camera); } catch (_) { }
  renderer.render(scene, camera);
  LP(1, 'Ready!'); ready = true; openMenu();
  await nf(); if (window.__ldone) window.__ldone(); else $('#loading')?.remove();
  try { sessionStorage.removeItem('wb-reloads'); } catch (_) { }
  setTimeout(() => { $('#money img').src = ICON.cash.url; $('#bStaff img').src = ICON.worker.url; $('#bUpg img').src = ICON.up.url; $('#bMenu img').src = ICON.menu.url; }, 700);
  setTimeout(warmIcons, 1600);
}
window.claude?.hot?.snapshot?.(() => save);
const hot = window.claude?.hot;
if (hot && hot.ready) hot.ready(start); else start(hot?.data ?? {});
requestAnimationFrame(frame);
